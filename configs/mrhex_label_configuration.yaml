    codebook_basis:
      canonical_name: Demyelinating disease of central nervous system
      operational_definition: Report identifies CNS demyelinating disease or lesions
        explicitly attributed to demyelination.
      anatomical_scope: Brain and spinal cord.
      accepted_equivalents:
