        pattern: (?i)\bseptum\s+pellucidum\s+(?:and|with)\s+cavum\s+vergae\b
        reason: Bounded septum-pellucidum-associated cavum construction.
      - pattern_id: COMP_CSP_SEPTUM_INTERPOSITUM
        pattern: (?i)\bcavum\s+septum\s+interpositum\b
        reason: Observed septum-associated cavum wording; distinct from cavum velum
          interpositum.
      - pattern_id: COMP_CSP_SPELLING_VARIANT
        pattern: (?i)\bcavum\s+septum\s+pel+icidum\s+et\s+var+gae\b
        reason: General spelling-tolerant form for septum-pellucidum et vergae wording.
