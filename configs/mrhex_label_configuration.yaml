  Empty sella syndrome:
    inheritance_status: OVERLAY_OWNED_NO_V2_MAPPING
    chunk1_acceptance_status: ACCEPTED
    chunk1_acceptance_gate: PASS
    candidate_id: D1_EMPTY_SELLA_ENSEMBLE_ALIGNED_01
    codebook_basis:
      label: Empty sella syndrome
      canonical_name: Empty sella syndrome
      operational_definition: Report identifies radiological empty-sella morphology
        involving the sella turcica/pituitary region.
      anatomical_scope: Sella turcica and pituitary region.
      accepted_equivalents:
      - empty sella
      - empty sella syndrome
      - empty sella turcica
      - partial empty sella
      - partial empty sella syndrome
      - empty sella appearance
      - partial empty sella appearance
      insufficient_evidence:
      - Isolated pituitary thinning/flattening or decreased pituitary height alone.
      - Isolated widened/enlarged/shallow sella alone.
      - Pituitary adenoma, Rathke cleft cyst, generic sellar cyst, postoperative sellar
        cavity, or pituitary hypoplasia alone.
      - Pseudotumor cerebri/intracranial hypertension workup alone without empty-sella
        morphology.
      subtype_rules: Include complete and partial empty-sella morphology. Exclude
        isolated non-specific sellar/pituitary findings listed above. This is AI_REFERENCE_ENSEMBLE_OPERATIONALIZATION,
        not clinical consensus revision.
    machine_rules:
      version: d1_overlay_owned_v1
      positive_terms:
      - empty sella
      - empty sella syndrome
      - partial empty sella
      - partial empty sella syndrome
      - Empty sella syndrome
      surface_forms:
      - empty sella turcica
      - partially empty sella
      - partially empty sella turcica
      - partial empty sella turcica
      - partially empty sella syndrome
      - empty sella appearance
      - partial empty sella appearance
      - partial-empty sella
      compositional_patterns:
      - pattern_id: D1_EMPTY_SELLA_COMP_01_CSF_HERNIATION_THINNED_PITUITARY
        pattern: (?i)(?:\b(?:suprasellar\s+cistern|csf)\b[\s\S]{0,160}?\b(?:herniat(?:ed|ion)|protrud(?:ed|ing)|exten(?:ded|sion))\b[\s\S]{0,160}?\b(?:into|within)\s+(?:the\s+)?sell(?:a(?:\s+turcica)?|ar\s+fossa)\b[\s\S]{0,220}?(?:\b(?:pituitary|adenohypophysis|hypophysis)\b[\s\S]{0,80}?\b(?:thinning|thinned|flattened|compressed|decreased\s+height|reduced\s+height)\b|\b(?:thinning|thinned|flattened|compressed|decreased\s+height|reduced\s+height)\b[\s\S]{0,80}?\b(?:pituitary|adenohypophysis|hypophysis)\b)|(?:\b(?:pituitary|adenohypophysis|hypophysis)\b[\s\S]{0,80}?\b(?:thinning|thinned|flattened|compressed|decreased\s+height|reduced\s+height)\b|\b(?:thinning|thinned|flattened|compressed|decreased\s+height|reduced\s+height)\b[\s\S]{0,80}?\b(?:pituitary|adenohypophysis|hypophysis)\b)[\s\S]{0,220}?\b(?:suprasellar\s+cistern|csf)\b[\s\S]{0,160}?\b(?:herniat(?:ed|ion)|protrud(?:ed|ing)|exten(?:ded|sion))\b[\s\S]{0,160}?\b(?:into|within)\s+(?:the\s+)?sell(?:a(?:\s+turcica)?|ar\s+fossa)\b)
        source_codebook_field: operational_definition
        source_text: CSF/suprasellar-cistern herniation into the sella with pituitary
          thinning (ensemble S family).
        rationale: Bounded ensemble-aligned morphology rule; isolated thinning alone
          does not match.
      - pattern_id: D1_EMPTY_SELLA_COMP_02_WIDENED_SELLA_FLATTENED_PITUITARY
        pattern: (?i)(?:(?:\bsella(?:\s+turcica)?\b[\s\S]{0,160}?\b(?:widened|enlarged|wide|widest|expanded|wider(?:\s+than\s+normal)?)\b|\b(?:widened|enlarged|wide|widest|expanded|wider(?:\s+than\s+normal)?)\b[\s\S]{0,160}?\bsella(?:\s+turcica)?\b)[\s\S]{0,220}?(?:\b(?:pituitary|adenohypophysis|hypophysis)\b[\s\S]{0,80}?\b(?:flattened|compressed|thin(?:ned)?|decreased\s+height|reduced\s+height|height\s+(?:is\s+)?decreas\w*|wider\s+than\s+normal|widest)\b|\b(?:flattened|compressed|thin(?:ned)?|decreased\s+height|reduced\s+height|height\s+(?:is\s+)?decreas\w*|wider\s+than\s+normal|widest)\b[\s\S]{0,80}?\b(?:pituitary|adenohypophysis|hypophysis)\b)|(?:\b(?:pituitary|adenohypophysis|hypophysis)\b[\s\S]{0,80}?\b(?:flattened|compressed|thin(?:ned)?|decreased\s+height|reduced\s+height|height\s+(?:is\s+)?decreas\w*|wider\s+than\s+normal|widest)\b|\b(?:flattened|compressed|thin(?:ned)?|decreased\s+height|reduced\s+height|height\s+(?:is\s+)?decreas\w*|wider\s+than\s+normal|widest)\b[\s\S]{0,80}?\b(?:pituitary|adenohypophysis|hypophysis)\b)[\s\S]{0,220}?(?:\bsella(?:\s+turcica)?\b[\s\S]{0,160}?\b(?:widened|enlarged|wide|widest|expanded|wider(?:\s+than\s+normal)?)\b|\b(?:widened|enlarged|wide|widest|expanded|wider(?:\s+than\s+normal)?)\b[\s\S]{0,160}?\bsella(?:\s+turcica)?\b))
        source_codebook_field: operational_definition
        source_text: Widened/enlarged sella with pituitary flattening (ensemble S
          family).
        rationale: Bounded ensemble-aligned morphology rule; isolated sellar widening
          or isolated pituitary findings alone do not match.
