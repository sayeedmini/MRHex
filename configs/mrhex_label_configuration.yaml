  Cyst of pineal gland:
    inheritance_status: KEEP_WITH_AUDITED_ADDITIONS
    chunk1_acceptance_status: ACCEPTED
    chunk1_acceptance_gate: PASS
    chunk1_changed_case_ids:
    - C01-00345
    - C01-02615
    codebook_basis:
      operational_definition: Report identifies a cyst arising in the pineal gland.
      accepted_equivalents:
      - Pineal cyst
      - pineal gland cyst
      - benign pineal cyst
      insufficient_evidence:
      - Pineal-region cystic mass alone
      - pineal calcification alone
      - enlarged pineal gland alone
      subtype_boundary: 'Include simple or complex cysts explicitly called pineal
        cysts. Exclude cystic pineal tumors and arachnoid cysts.

        '
    accepted_chunk1_gap_cases:
    - C01-00345
    - C01-02615
    deferred_chunk1_cases:
    - case_id: C01-01423
      reason: possible-neoplasm / conflict boundary remains intentionally routed
    - case_id: C01-01813
      reason: mixed certainty remains intentionally routed
    - case_id: C01-02749
      reason: findings/impression certainty interaction remains intentionally routed
    add_compositional_patterns:
    - pattern_id: D1_PINEAL_COMP_01_NORMAL_VARIANT_FORM
      pattern: (?i)\bpineal\s+gland\b(?!\s+region\b)(?:(?![.!?;\n]).){0,110}?\b(?:is|appears)\s+(?:in\s+the\s+form\s+of|as)\s+(?:an?\s+)?(?:normal(?:\s+variant)?\s+|benign\s+|simple\s+)?cyst\b
      source_codebook_field: operational_definition
      source_text: Report identifies a cyst arising in the pineal gland.
      development_case: C01-00345
      rationale: 'The finding explicitly states that the pineal gland itself is in
        the form of a normal-variant cyst; this is a current radiologic assertion,
        not merely clinical-history follow-up text.

        '
    - pattern_id: D1_PINEAL_COMP_02_FRONTED_GLAND_SIMPLE_CYST
      pattern: (?i)\bin\s+the\s+pineal\s+gland\b(?!\s+region\b)(?:(?!(?:[!?;\n]|\.(?!\d)|\b(?:while|whereas|but|however)\b)).){0,180}?\b(?:a\s+)?(?:(?:thin[-\s]?walled)\s+)?(?:simple\s+)?cyst\s+(?:is|was)\s+(?:observed|seen|noted)\b
      source_codebook_field: operational_definition
      source_text: Report identifies a cyst arising in the pineal gland.
      development_case: C01-02615
      rationale: 'Fronted pineal-gland anatomy plus an explicitly observed thin-walled/simple
        cyst establishes the cyst as arising in the pineal gland. Coordinating contrast
        terms and sentence boundaries are blocked to reduce cross-entity capture.

        '
  Foraminal Spinal Stenosis:
    inheritance_status: KEEP_WITH_AUDITED_ADDITION
    chunk1_acceptance_status: ACCEPTED
    chunk1_acceptance_gate: PASS
    chunk1_changed_case_ids:
    - C01-02965
    candidate_id: D1_FORAMINAL_COMP_01
    codebook_basis:
      operational_definition: Report identifies narrowing of one or more spinal neural
        foramina.
      anatomical_scope: Cervical, thoracic or lumbar neural/intervertebral foramina.
      accepted_equivalents:
      - Neural foraminal stenosis
      - neuroforaminal narrowing
      - foraminal narrowing at a spinal level.
      insufficient_evidence:
      - Facet arthropathy, foraminal disc herniation, root contact or central canal
        stenosis alone.
      subtype_boundary: 'Include mild/moderate/severe and unilateral/bilateral foraminal
        stenosis. Exclude isolated central canal or lateral-recess stenosis.

        '
      special_case: 'No significant foraminal stenosis does not explicitly exclude
        mild narrowing. Nerve-root compression need not be present.

        '
    predeclared_chunk1_changed_case_ids:
