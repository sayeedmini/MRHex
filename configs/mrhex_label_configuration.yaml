  Choroid plexus cyst:
    inheritance_status: KEEP_WITH_AUDITED_ADDITION
    chunk1_acceptance_status: ACCEPTED
    chunk1_acceptance_gate: PASS
    chunk1_changed_case_ids:
    - C01-02028
    candidate_id: D1_CHOROID_PLEXUS_CYST_COMP_01
    codebook_basis:
      operational_definition: Report identifies a cyst within the choroid plexus.
      anatomical_scope: Choroid plexus of the cerebral ventricles.
      accepted_equivalents:
      - Choroid plexus cyst
      - cyst of the choroid plexus.
      insufficient_evidence:
      - Intraventricular cyst alone
      - choroid plexus enlargement alone
      - calcification alone
      - xanthogranuloma alone
      subtype_boundary: 'Include unilateral/bilateral named choroid plexus cysts.
        Exclude colloid cyst and choroid plexus tumors.

        '
      special_case: 'Do not equate xanthogranuloma with a cyst unless the report explicitly
        identifies a choroid plexus cyst.

        '
    predeclared_chunk1_changed_case_ids:
    - C01-02028
    protected_chunk1_cases:
    - case_id: C01-01372
      required_behavior: not_SAFE_S
      reason: 'Cystic lesions in the choroid plexuses are explicitly evaluated as
        favoring xanthogranuloma.

        '
    - case_id: C01-01487
      required_behavior: remains_UC
      reason: Explicit cyst/xanthogranuloma differential.
    - case_id: C01-01537
      required_behavior: remains_UC
      reason: Suggestive target wording remains hedged.
    add_compositional_patterns:
    - pattern_id: D1_CHOROID_PLEXUS_CYST_COMP_01_CONTAINMENT
      pattern: (?i)\bcyst\b(?!(?:(?![.!?;\n]).){0,180}\b(?:xanthogranuloma|colloid|tumou?r|neoplasm)\b)(?:(?![.!?;\n]).){0,100}?\b(?:located\s+)?(?:in|within)\s+(?:the\s+)?(?:glomus\s+of\s+(?:the\s+)?)?choroid\s+plexus\b
      source_codebook_field: operational_definition
      source_text: Report identifies a cyst within the choroid plexus.
      development_case: C01-02028
      rationale: 'Retrieves explicit cyst-to-choroid-plexus containment while blocking
        competing xanthogranuloma, colloid, tumor, or neoplasm wording in the same
        local sentence window.

        '
